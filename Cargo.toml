[package]
name = "pandora"
version = "1.0.0"
edition = "2024"

[dependencies]
bytemuck = "1.23.1"
clap = { version = "4.5.43", features = ["derive"] }
image = "0.25.6"
fast_image_resize = {version = "5.2.1", features = ["rayon", "image"]}
knus = "3.3.1"
miette = { version = "7.6.0", features = ["fancy"] }
niri-ipc = { version = "=25.8.0" }
notify = "8.2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.140"
shellexpand = "3.1.1"
tempfile = "3.20.0"
wayrs-client = "1.3.1"
wayrs-protocols = { version = "0.14", features = ["wlr-layer-shell-unstable-v1", "linux-dmabuf-v1", "viewporter"] }
wayrs-utils = { version = "0.17" }


